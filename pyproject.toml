[project]
name = "nano-grpo-envs"
version = "0.1.0"
description = "Fast GRPO training for 7B-ish models with vLLM, Liger kernels, and reasoning gym environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10.1",
    "deepspeed>=0.18.0",
    "fastapi>=0.119.0",
    "flash-attn>=2.8.3",
    "liger-kernel>=0.6.2",
    "reasoning-gym>=0.1.24",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "trl>=0.23.1",
    "uvicorn>=0.37.0",
    "vllm>=0.11.0",
]
